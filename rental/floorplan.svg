<text x="1000" y="760" font-size="16" font-weight="bold" fill="#333">说明</text>
<text x="1000" y="784" font-size="14" font-weight="normal" fill="#333">1. 本图按视频行走顺序推断房间连接关系，</text>
<text x="1000" y="808" font-size="14" font-weight="normal" fill="#333">   墙体长度、面积、朝向均未实测，仅供示意。</text>
<text x="1000" y="832" font-size="14" font-weight="normal" fill="#333">2. 门洞A/B：大厅有两个门洞通向楼梯口和门厅，</text>
<text x="1000" y="856" font-size="14" font-weight="normal" fill="#333">   门C 通后厅；后厅另一侧门洞去向未拍到。</text>
<text x="1000" y="880" font-size="14" font-weight="normal" fill="#333">3. 客厅内一扇未开启的门，推测与厨房相通。</text>
<text x="1000" y="904" font-size="14" font-weight="normal" fill="#333">4. 卫生间与卧室位于走廊尽头一侧，</text>
<text x="1000" y="928" font-size="14" font-weight="normal" fill="#333">   中间有一小段过道（视频里走得较快，位置为推断）。</text>
<text x="1000" y="952" font-size="14" font-weight="normal" fill="#333">5. 地面：走廊、楼梯口、厨房为红陶砖；</text>
<text x="1000" y="976" font-size="14" font-weight="normal" fill="#333">   大厅、客厅、卧室、卫生间为白色瓷砖。</text>

<text x="880" y="605" font-size="15" font-weight="bold" fill="#333">依据</text>
<text x="880" y="627" font-size="13" font-weight="normal" fill="#333">1. 楼梯口左转即门洞D进大厅；沿走廊（左侧护栏）</text>
<text x="880" y="649" font-size="13" font-weight="normal" fill="#333">   到尽头，正前方厨房门，右侧客厅门。</text>
<text x="880" y="671" font-size="13" font-weight="normal" fill="#333">2. 大厅为长方形：门洞D与门C在两端，三扇窗</text>
<text x="880" y="693" font-size="13" font-weight="normal" fill="#333">   在同一面长墙，靠门C一端堆放床垫杂物。</text>
<text x="880" y="715" font-size="13" font-weight="normal" fill="#333">3. 门C后是小过道，卫生间与卧室都从过道进；</text>
<text x="880" y="737" font-size="13" font-weight="normal" fill="#333">   视频 1:15 由门C进过道右拐入卫生间，1:24</text>
<text x="880" y="759" font-size="13" font-weight="normal" fill="#333">   出卫生间直接进卧室。</text>
<text x="880" y="781" font-size="13" font-weight="normal" fill="#333">4. 厨房、客厅各有一扇未开启的门，去向为推测。</text>
<text x="880" y="803" font-size="13" font-weight="normal" fill="#333">5. 相邻关系由视频三维重建与逐帧核对得出；</text>
<text x="880" y="825" font-size="13" font-weight="normal" fill="#333">   墙体尺寸、面积、真实朝向未实测。</text>
